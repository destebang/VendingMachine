name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the app image
        run: docker compose build app

      - name: Start the stack
        # Only the infrastructure and the app: the integration suite drives its
        # own outbox relay and Sales worker, so the long-running worker services
        # must not compete with it for the same queues.
        run: docker compose up -d mongodb redis rabbitmq app

      - name: Wait for MongoDB and Redis
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T app php bin/console app:health-check; then
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become healthy in time" >&2
          exit 1

      - name: Wait for RabbitMQ
        run: |
          # The integration tests connect to `rabbitmq:5672` from the app
          # container, so wait until that exact connection succeeds — the node
          # can report `ping` before the AMQP listener accepts connections.
          for i in $(seq 1 30); do
            if docker compose exec -T app php -r '$c = new AMQPConnection(["host" => "rabbitmq", "port" => 5672, "login" => "guest", "password" => "guest", "vhost" => "/"]); $c->connect();'; then
              exit 0
            fi
            sleep 2
          done
          echo "RabbitMQ did not become reachable in time" >&2
          exit 1

      - name: Run unit test suite
        run: docker compose exec -T app vendor/bin/phpunit --testsuite=unit

      - name: Run integration test suite
        run: >
          docker compose exec -T
          -e MONGO_DB=vending_test
          -e REDIS_URL=redis://redis:6379/1
          app vendor/bin/phpunit --testsuite=integration

      - name: Run functional test suite
        run: >
          docker compose exec -T
          -e MONGO_DB=vending_test
          -e REDIS_URL=redis://redis:6379/1
          app vendor/bin/phpunit --testsuite=functional

      - name: Tear down
        if: always()
        run: docker compose down -v
