parameters:
    # Middleware Symfony's MessengerPass assembles each bus from. The publish
    # middleware sits outside `handle_message` on the command bus, so the events
    # a command recorded are published for every outcome, success or rejection.
    command.bus.middleware:
        - { id: App\Shared\Infrastructure\EventBus\PublishDomainEventsMiddleware }
        - { id: command.bus.middleware.handle_message }
    query.bus.middleware:
        - { id: query.bus.middleware.handle_message }
    domain_event.bus.middleware:
        - { id: domain_event.bus.middleware.handle_message }
    integration.bus.middleware:
        - { id: integration.bus.middleware.handle_message }

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\:
        resource: '../src/*'
        exclude:
            - '../src/Kernel'
            - '../src/Shared/Domain'
            - '../src/Shared/Application'
            - '../src/VendingMachine/Domain/Model'
            - '../src/VendingMachine/Domain/Event'
            - '../src/VendingMachine/Domain/Exception'
            - '../src/VendingMachine/Infrastructure/Persistence/Mongo/VendingMachineDocument.php'

    App\VendingMachine\Infrastructure\Http\:
        resource: '../src/VendingMachine/Infrastructure/Http'
        public: true

    App\VendingMachine\Infrastructure\Console\:
        resource: '../src/VendingMachine/Infrastructure/Console'
        public: true

    # --- Ports -> adapters -------------------------------------------------
    App\VendingMachine\Domain\Repository\VendingMachineRepository:
        alias: App\VendingMachine\Infrastructure\Persistence\Mongo\MongoVendingMachineRepository

    App\VendingMachine\Application\ReadModel\VendingMachineStateReadModelRepository:
        alias: App\VendingMachine\Infrastructure\ReadModel\Redis\RedisVendingMachineStateReadModelRepository

    # --- Third-party clients, built by hand-written factories --------------
    Doctrine\ODM\MongoDB\DocumentManager:
        factory: ['App\Kernel\DocumentManagerFactory', 'create']

    Predis\ClientInterface:
        factory: ['App\Kernel\RedisClientFactory', 'create']

    # --- Logging -------------------------------------------------------------
    # A failing domain event subscriber is logged and swallowed: the write has
    # already committed, so the command response must not fail.
    Psr\Log\LoggerInterface:
        class: Symfony\Component\HttpKernel\Log\Logger

    # --- Command bus (Messenger, sync, in-memory) ---------------------------
    # Handlers self-register: `#[CommandHandler]`/`#[QueryHandler]` services are
    # autoconfigured onto this bus, and Symfony's MessengerPass builds the bus
    # and its handlers locator from those tags. No hand-written message→handler
    # map lives here.
    Symfony\Component\Messenger\MessageBusInterface: '@command.bus'

    # The write-side driving adapters depend on the framework-free port; the
    # Kernel adapter is the only place that knows Messenger.
    App\Shared\Application\Bus\CommandBus:
        alias: App\Kernel\Bus\MessengerCommandBus

    App\Kernel\Bus\MessengerCommandBus:
        arguments:
            $commandBus: '@command.bus'

    command.bus:
        class: Symfony\Component\Messenger\MessageBus
        tags: [messenger.bus]
        # Public so the integration suite can dispatch commands through the
        # exact same bus the driving adapters use, wiring included.
        public: true
        # Replaced by MessengerPass with the middleware list from the
        # `command.bus.middleware` parameter.
        arguments:
            - []

    command.bus.middleware.handle_message:
        class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
        # Replaced by MessengerPass with the generated handlers locator.
        arguments:
            - []

    # --- Query bus (Messenger, sync, in-memory) -----------------------------
    # The read side rides its own bus: `#[QueryHandler]` services are
    # autoconfigured onto it, and the `QueryBus` port is the only thing the
    # driving adapters see.
    App\Shared\Application\Bus\QueryBus:
        alias: App\Kernel\Bus\MessengerQueryBus

    App\Kernel\Bus\MessengerQueryBus:
        arguments:
            $queryBus: '@query.bus'

    query.bus:
        class: Symfony\Component\Messenger\MessageBus
        tags: [messenger.bus]
        # Replaced by MessengerPass with the middleware list from the
        # `query.bus.middleware` parameter.
        arguments:
            - []

    query.bus.middleware.handle_message:
        class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
        # Replaced by MessengerPass with the generated handlers locator.
        arguments:
            - []

    # --- Domain event bus (Messenger, sync, in-memory) ----------------------
    # The write-side repository hands the events an aggregate recorded to the
    # collector once its flush commits; the command-bus middleware publishes
    # them on this bus when the command is done. There is no transport:
    # subscribers run synchronously in the same process, so the read-model
    # projection is up to date by the time the command returns. Subscribers
    # self-register through `#[DomainEventSubscriber]` — an event may have any
    # number of them, and no hand-written event→subscriber map lives here.
    App\Shared\Domain\Event\DomainEventBus:
        alias: App\Shared\Infrastructure\EventBus\MessengerDomainEventBus

    App\Shared\Infrastructure\EventBus\MessengerDomainEventBus:
        arguments:
            $bus: '@domain_event.bus'

    domain_event.bus:
        class: Symfony\Component\Messenger\MessageBus
        tags: [messenger.bus]
        # Replaced by MessengerPass with the middleware list from the
        # `domain_event.bus.middleware` parameter.
        arguments:
            - []

    domain_event.bus.middleware.handle_message:
        class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
        # Replaced by MessengerPass with the generated handlers locator.
        arguments:
            - []

    # --- Integration bus (Messenger over AMQP, async) -----------------------
    # The published language rides its own bus, separate from the synchronous
    # domain bus: integration events are separate classes with small primitive
    # payloads, published to the durable topic exchange `vending_machine.integration`
    # with the event type as the routing key. The outbox relay is the only
    # publisher; `#[IntegrationEventSubscriber]` consumers land in a later
    # slice and will be autoconfigured onto `integration.bus`.
    App\Shared\Application\IntegrationEvent\IntegrationEventBus:
        alias: App\Kernel\IntegrationEvent\MessengerIntegrationEventBus

    App\Kernel\IntegrationEvent\MessengerIntegrationEventBus:
        arguments:
            $transport: '@messenger.transport.integration_events'

    App\Kernel\IntegrationEvent\JsonEnvelopeSerializer:
        arguments:
            # Envelope type => event class: how a consumed message is decoded
            # back into a typed event without a PHP class name on the wire.
            $eventTypes:
                'vending_machine.item_vended.v1': 'App\VendingMachine\Application\IntegrationEvent\ItemVendedV1'

    messenger.transport.integration_events:
        class: Symfony\Component\Messenger\Bridge\Amqp\Transport\AmqpTransport
        factory: ['App\Kernel\IntegrationEvent\AmqpTransportFactory', 'create']

    integration.bus:
        class: Symfony\Component\Messenger\MessageBus
        tags: [messenger.bus]
        # Replaced by MessengerPass with the middleware list from the
        # `integration.bus.middleware` parameter.
        arguments:
            - []

    integration.bus.middleware.handle_message:
        class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
        # Replaced by MessengerPass with the generated handlers locator.
        arguments:
            - []

    # Symfony Messenger's own console commands, built by hand and pulled from
    # the container in bin/console.
    Symfony\Component\Messenger\Command\ConsumeMessagesCommand:
        factory: ['App\Kernel\IntegrationEvent\MessengerCommandsFactory', 'createConsumeMessagesCommand']
        arguments:
            - '@integration.bus'
            - '@messenger.transport.integration_events'
        public: true

    Symfony\Component\Messenger\Command\SetupTransportsCommand:
        factory: ['App\Kernel\IntegrationEvent\MessengerCommandsFactory', 'createSetupTransportsCommand']
        arguments:
            - '@messenger.transport.integration_events'
        public: true

